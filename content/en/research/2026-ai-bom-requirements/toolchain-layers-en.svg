<svg xmlns="http://www.w3.org/2000/svg" width="820" height="448" viewBox="0 0 820 448">
  <defs>
    <filter id="p1" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="820" height="448" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">

    <text x="40" y="28" font-size="12" letter-spacing="1.6" fill="#6b7280">A PIPELINE SHARED BY BOTH LAYERS</text>

    <!-- three shared steps -->
    <rect x="40" y="44" width="222" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#p1)"/>
    <text x="60" y="70" font-size="14" fill="#111827">Generate</text>
    <text x="60" y="92" font-size="12.5" fill="#6b7280">cdxgen aibom</text>
    <text x="60" y="110" font-size="12.5" fill="#6b7280">Output as CycloneDX 1.6</text>

    <line x1="262" y1="82" x2="290" y2="82" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pa)"/>

    <rect x="298" y="44" width="222" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#p1)"/>
    <text x="318" y="70" font-size="14" fill="#111827">Enrich</text>
    <text x="318" y="92" font-size="12.5" fill="#6b7280">ModelScan scanning</text>
    <text x="318" y="110" font-size="12.5" fill="#6b7280">sigstore signing</text>

    <line x1="520" y1="82" x2="548" y2="82" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pa)"/>

    <rect x="556" y="44" width="224" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#p1)"/>
    <text x="576" y="70" font-size="14" fill="#111827">Validate</text>
    <text x="576" y="92" font-size="12.5" fill="#6b7280">Apply policy by role</text>
    <text x="576" y="110" font-size="12.5" fill="#6b7280">sbomqs, Rego</text>

    <!-- branch -->
    <path d="M 668 120 L 668 152 L 215 152 L 215 176" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pa)"/>
    <path d="M 668 152 L 605 152 L 605 176" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pa)"/>
    <text x="248" y="144" font-size="12.5" fill="#6b7280">The steps match up to validation; from here the two layers part ways</text>

    <!-- software layer -->
    <text x="40" y="204" font-size="12" letter-spacing="1.6" fill="#6b7280">SOFTWARE LAYER</text>
    <rect x="40" y="216" width="350" height="164" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#p1)"/>
    <text x="60" y="246" font-size="15" fill="#111827">Existing tools take it as it is</text>
    <text x="60" y="274" font-size="12.5" fill="#6b7280">Load into Dependency-Track</text>
    <text x="60" y="294" font-size="12.5" fill="#6b7280">Correlate vulnerabilities via OSV and NVD</text>
    <text x="60" y="314" font-size="12.5" fill="#6b7280">"Which projects use this component?" analysis</text>
    <rect x="60" y="332" width="200" height="30" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="160" y="352" text-anchor="middle" font-size="12.5" fill="#4b5563">Almost no extra work</text>

    <!-- model and dataset layer (highlight) -->
    <text x="430" y="204" font-size="12" letter-spacing="1.6" fill="#c2410c">MODEL AND DATASET LAYER</text>
    <rect x="430" y="216" width="350" height="164" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.8" filter="url(#p1)"/>
    <text x="450" y="246" font-size="15" fill="#111827">No classifier support, so a detour</text>
    <text x="450" y="274" font-size="12.5" fill="#6b7280">Upload as ordinary components</text>
    <text x="450" y="294" font-size="12.5" fill="#6b7280">Model card fields kept in properties</text>
    <text x="450" y="314" font-size="12.5" fill="#6b7280">Model-specific threats go to ModelScan</text>
    <rect x="450" y="332" width="240" height="30" rx="5" fill="#fdf1e9" stroke="#e8c4a8"/>
    <text x="570" y="352" text-anchor="middle" font-size="12.5" fill="#c2410c">A stopgap until classifiers land</text>

    <!-- note -->
    <line x1="40" y1="406" x2="780" y2="406" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="426" font-size="12.5" fill="#4b5563">As a detour, discoverability suffers. It stays traceable, but querying or filtering by model attributes is hard.</text>
  </g>
</svg>
