<svg xmlns="http://www.w3.org/2000/svg" width="820" height="448" viewBox="0 0 820 448">
  <defs>
    <filter id="p1" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="820" height="448" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">

    <text x="40" y="28" font-size="12" letter-spacing="1.6" fill="#6b7280">두 계층이 공유하는 파이프라인</text>

    <!-- 공통 3단계 -->
    <rect x="40" y="44" width="222" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#p1)"/>
    <text x="60" y="70" font-size="14" fill="#111827">생성</text>
    <text x="60" y="92" font-size="12.5" fill="#6b7280">cdxgen aibom</text>
    <text x="60" y="110" font-size="12.5" fill="#6b7280">CycloneDX 1.6으로 출력</text>

    <line x1="262" y1="82" x2="290" y2="82" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pa)"/>

    <rect x="298" y="44" width="222" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#p1)"/>
    <text x="318" y="70" font-size="14" fill="#111827">보강</text>
    <text x="318" y="92" font-size="12.5" fill="#6b7280">ModelScan 스캔</text>
    <text x="318" y="110" font-size="12.5" fill="#6b7280">sigstore 서명</text>

    <line x1="520" y1="82" x2="548" y2="82" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pa)"/>

    <rect x="556" y="44" width="224" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#p1)"/>
    <text x="576" y="70" font-size="14" fill="#111827">검증</text>
    <text x="576" y="92" font-size="12.5" fill="#6b7280">역할별 정책 적용</text>
    <text x="576" y="110" font-size="12.5" fill="#6b7280">sbomqs, Rego</text>

    <!-- 분기 -->
    <path d="M 668 120 L 668 152 L 215 152 L 215 176" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pa)"/>
    <path d="M 668 152 L 605 152 L 605 176" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pa)"/>
    <text x="248" y="144" font-size="12.5" fill="#6b7280">검증까지는 같은 절차, 여기서 두 계층의 사정이 갈립니다</text>

    <!-- 소프트웨어 계층 -->
    <text x="40" y="204" font-size="12" letter-spacing="1.6" fill="#6b7280">소프트웨어 계층</text>
    <rect x="40" y="216" width="350" height="164" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#p1)"/>
    <text x="60" y="246" font-size="15" fill="#111827">기존 도구가 그대로 받습니다</text>
    <text x="60" y="274" font-size="12.5" fill="#6b7280">Dependency-Track에 적재</text>
    <text x="60" y="294" font-size="12.5" fill="#6b7280">OSV·NVD로 취약점 상관</text>
    <text x="60" y="314" font-size="12.5" fill="#6b7280">"이 컴포넌트를 쓰는 프로젝트는?" 영향분석</text>
    <rect x="60" y="332" width="200" height="30" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="160" y="352" text-anchor="middle" font-size="12.5" fill="#4b5563">추가 작업이 거의 없음</text>

    <!-- 모델·데이터셋 계층 (강조) -->
    <text x="430" y="204" font-size="12" letter-spacing="1.6" fill="#c2410c">모델·데이터셋 계층</text>
    <rect x="430" y="216" width="350" height="164" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.8" filter="url(#p1)"/>
    <text x="450" y="246" font-size="15" fill="#111827">분류자 지원이 없어 우회합니다</text>
    <text x="450" y="274" font-size="12.5" fill="#6b7280">일반 컴포넌트로 올리고</text>
    <text x="450" y="294" font-size="12.5" fill="#6b7280">모델 카드 필드는 properties로 보존</text>
    <text x="450" y="314" font-size="12.5" fill="#6b7280">모델 고유 위협은 ModelScan으로 따로</text>
    <rect x="450" y="332" width="240" height="30" rx="5" fill="#fdf1e9" stroke="#e8c4a8"/>
    <text x="570" y="352" text-anchor="middle" font-size="12.5" fill="#c2410c">분류자 지원이 올 때까지 임시 방편</text>

    <!-- 주석 -->
    <line x1="40" y1="406" x2="780" y2="406" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="426" font-size="12.5" fill="#4b5563">우회 상태에서는 검색성이 제한됩니다. 추적은 되지만 모델 속성으로 질의하거나 필터링하기는 어렵습니다.</text>
  </g>
</svg>
