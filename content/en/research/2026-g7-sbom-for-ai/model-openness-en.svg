<svg xmlns="http://www.w3.org/2000/svg" width="820" height="368" viewBox="0 0 820 368">
  <defs>
    <filter id="o1" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="820" height="368" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">

    <text x="40" y="30" font-size="14" fill="#111827">Model licensing must be stated on four separate axes</text>
    <text x="40" y="52" font-size="12.5" fill="#6b7280">A license name alone does not say what was released. The four axes are independent, and partial release is common.</text>

    <!-- four axes -->
    <rect x="40" y="74" width="180" height="130" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#o1)"/>
    <text x="60" y="102" font-size="14" fill="#111827">Open weight</text>
    <text x="60" y="124" font-size="12.5" fill="#6b7280">Can the trained weights</text>
    <text x="60" y="142" font-size="12.5" fill="#6b7280">be downloaded and used</text>
    <line x1="60" y1="158" x2="200" y2="158" stroke="#f3f4f6" stroke-width="1"/>
    <text x="60" y="180" font-size="12" fill="#9ca3af">Most commonly opened</text>

    <rect x="234" y="74" width="180" height="130" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#o1)"/>
    <text x="254" y="102" font-size="14" fill="#111827">Open architecture</text>
    <text x="254" y="124" font-size="12.5" fill="#6b7280">Is the model structure</text>
    <text x="254" y="142" font-size="12.5" fill="#6b7280">and design published</text>
    <line x1="254" y1="158" x2="394" y2="158" stroke="#f3f4f6" stroke-width="1"/>
    <text x="254" y="180" font-size="12" fill="#9ca3af">Premise for reproduction</text>

    <rect x="428" y="74" width="180" height="130" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.8" filter="url(#o1)"/>
    <text x="448" y="102" font-size="14" fill="#111827">Open data</text>
    <text x="448" y="124" font-size="12.5" fill="#6b7280">Is the data used for</text>
    <text x="448" y="142" font-size="12.5" fill="#6b7280">training published</text>
    <line x1="448" y1="158" x2="588" y2="158" stroke="#fdf1e9" stroke-width="1"/>
    <text x="448" y="180" font-size="12" fill="#c2410c">Grounds for legal review</text>

    <rect x="622" y="74" width="158" height="130" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#o1)"/>
    <text x="642" y="102" font-size="14" fill="#111827">Open training</text>
    <text x="642" y="124" font-size="12.5" fill="#6b7280">Is the training process</text>
    <text x="642" y="142" font-size="12.5" fill="#6b7280">and method published</text>
    <line x1="642" y1="158" x2="762" y2="158" stroke="#f3f4f6" stroke-width="1"/>
    <text x="642" y="180" font-size="12" fill="#9ca3af">Drives retrainability</text>

    <!-- example -->
    <rect x="40" y="228" width="740" height="82" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="254" font-size="13" fill="#111827">Why they must be stated one by one</text>
    <text x="60" y="278" font-size="12.5" fill="#6b7280">Models that release weights while saying nothing about training data are often called "open". Stating the four axes</text>
    <text x="60" y="296" font-size="12.5" fill="#6b7280">separately lets an adopter tell what can be verified from what cannot.</text>

    <!-- note -->
    <line x1="40" y1="332" x2="780" y2="332" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="352" font-size="12.5" fill="#4b5563">One of the 13 elements in the model cluster, cited as what the G7 document adds to existing SBOM standards.</text>
  </g>
</svg>
