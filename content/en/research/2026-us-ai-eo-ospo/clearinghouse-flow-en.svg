<svg xmlns="http://www.w3.org/2000/svg" width="820" height="452" viewBox="0 0 820 452">
  <defs>
    <filter id="u3" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/></filter>
    <marker id="ub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/></marker>
    <marker id="ub2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 9 1 L 0 5 L 9 9 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="820" height="452" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">

    <rect x="40" y="34" width="330" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#u3)"/>
    <text x="60" y="60" font-size="13.5" fill="#111827">AI Cybersecurity Clearinghouse</text>
    <text x="60" y="82" font-size="12" fill="#6b7280">Treasury-led, with NSA, CISA and the ONCD</text>
    <text x="60" y="100" font-size="12" fill="#9ca3af">To be stood up by 2026-07-02</text>

    <line x1="370" y1="72" x2="446" y2="72" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ub)" marker-start="url(#ub2)"/>
    <text x="380" y="62" font-size="11" fill="#9ca3af">Coordination</text>

    <rect x="454" y="34" width="326" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#u3)"/>
    <text x="474" y="60" font-size="13.5" fill="#111827">Voluntary participants</text>
    <text x="474" y="82" font-size="12" fill="#6b7280">AI developers able to find vulnerabilities</text>
    <text x="474" y="100" font-size="12" fill="#6b7280">Critical infrastructure operators</text>

    <line x1="617" y1="110" x2="617" y2="140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ub)"/>
    <text x="630" y="132" font-size="11.5" fill="#9ca3af">Coordinated disclosure</text>

    <rect x="454" y="148" width="326" height="66" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#u3)"/>
    <text x="474" y="174" font-size="13.5" fill="#111827">Open source maintainers</text>
    <text x="474" y="196" font-size="12" fill="#6b7280">Receive the report and produce a patch</text>

    <line x1="617" y1="214" x2="617" y2="244" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ub)"/>
    <text x="630" y="236" font-size="11.5" fill="#c2410c">Patch released</text>

    <rect x="454" y="252" width="326" height="86" rx="8" fill="#fdf1e9" stroke="#c2410c" stroke-width="1.8" filter="url(#u3)"/>
    <text x="474" y="278" font-size="14" fill="#111827">Corporate open source managers</text>
    <text x="474" y="300" font-size="12" fill="#c2410c">The side that receives and applies patches</text>
    <text x="474" y="322" font-size="12" fill="#6b7280">Scopes impact with SBOM, runs a CVD process</text>

    <path d="M 205 110 L 205 295 L 450 295" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ub)"/>
    <text x="60" y="200" font-size="12" fill="#6b7280">Guidance and release coordination</text>
    <text x="60" y="220" font-size="11.5" fill="#9ca3af">How it will operate has</text>
    <text x="60" y="238" font-size="11.5" fill="#9ca3af">not been disclosed</text>

    <line x1="40" y1="382" x2="780" y2="382" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="402" font-size="12.5" fill="#4b5563">The order settles the relationship between government and AI developers, not the duties of the companies that receive</text>
    <text x="40" y="422" font-size="12.5" fill="#4b5563">the patches. Even so, as findings grow, the demand for patching lands on those companies.</text>
    <text x="40" y="444" font-size="12" fill="#9ca3af">The words "open source" never appear in the order, yet the impact arrives through the open source supply chain.</text>
  </g>
</svg>
