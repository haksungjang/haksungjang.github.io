<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <defs>
    <filter id="m2" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="820" height="420" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">

    <text x="40" y="28" font-size="12" letter-spacing="1.6" fill="#6b7280">수출기업이 마주한 해외 제도</text>
    <text x="450" y="28" font-size="12" letter-spacing="1.6" fill="#6b7280">로드맵이 배치한 국내 과제</text>

    <!-- 1 -->
    <rect x="40" y="44" width="330" height="68" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m2)"/>
    <text x="60" y="70" font-size="13.5" fill="#111827">미국 NIST SSDF · 행정명령 14028</text>
    <text x="60" y="92" font-size="12" fill="#6b7280">연방 조달에 안전한 개발 관행을 요구</text>
    <line x1="370" y1="78" x2="442" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ma)"/>
    <rect x="450" y="44" width="330" height="68" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m2)"/>
    <text x="470" y="70" font-size="13.5" fill="#111827">안전한 SW 개발 방법론</text>
    <text x="470" y="92" font-size="12" fill="#6b7280">기획설계부터 배포까지 단계별 보안 활동</text>

    <!-- 2 (강조) -->
    <rect x="40" y="128" width="330" height="68" rx="8" fill="#fdf1e9" stroke="#c2410c" stroke-width="1.6" filter="url(#m2)"/>
    <text x="60" y="154" font-size="13.5" fill="#111827">미국 FDA §524B · EU 사이버복원력법</text>
    <text x="60" y="176" font-size="12" fill="#c2410c">SBOM 제출을 직접 의무로 규정</text>
    <line x1="370" y1="162" x2="442" y2="162" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ma)"/>
    <rect x="450" y="128" width="330" height="68" rx="8" fill="#fdf1e9" stroke="#c2410c" stroke-width="1.6" filter="url(#m2)"/>
    <text x="470" y="154" font-size="13.5" fill="#111827">SBOM 관리모델</text>
    <text x="470" y="176" font-size="12" fill="#c2410c">수출기업과 파급력 높은 분야에 우선 적용</text>

    <!-- 3 -->
    <rect x="40" y="212" width="330" height="68" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m2)"/>
    <text x="60" y="238" font-size="13.5" fill="#111827">EU 사이버복원력법 취약점 보고</text>
    <text x="60" y="260" font-size="12" fill="#6b7280">인지 후 24시간 조기 경보, 72시간 통지</text>
    <line x1="370" y1="246" x2="442" y2="246" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ma)"/>
    <rect x="450" y="212" width="330" height="68" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m2)"/>
    <text x="470" y="238" font-size="13.5" fill="#111827">CVD·VDP 확대</text>
    <text x="470" y="260" font-size="12" fill="#6b7280">버그바운티 범위 확대, 망법 개정 추진</text>

    <!-- 4 -->
    <rect x="40" y="296" width="330" height="68" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m2)"/>
    <text x="60" y="322" font-size="13.5" fill="#111827">미국 사이버 신뢰 마크 · 영국 PSTI</text>
    <text x="60" y="344" font-size="12" fill="#6b7280">소비자 기기 보안 라벨링과 인증</text>
    <line x1="370" y1="330" x2="442" y2="330" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ma)"/>
    <rect x="450" y="296" width="330" height="68" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m2)"/>
    <text x="470" y="322" font-size="13.5" fill="#111827">시범인증과 상호인정</text>
    <text x="470" y="344" font-size="12" fill="#6b7280">SSS Verified 발급, 제도화 국가와 MRA</text>

    <!-- 주석 -->
    <line x1="40" y1="386" x2="780" y2="386" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="406" font-size="12.5" fill="#4b5563">SBOM 계통이 로드맵의 중심입니다. 규제가 제출을 직접 요구하는 유일한 항목이어서 수출기업에는 이미 시장 진입 조건입니다.</text>
  </g>
</svg>
