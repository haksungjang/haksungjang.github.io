<svg xmlns="http://www.w3.org/2000/svg" width="800" height="586" viewBox="0 0 800 586">
  <defs>
    <filter id="g1" x="-25%" y="-30%" width="150%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.10"/></filter>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="800" height="586" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="40" y="28" font-size="12" letter-spacing="1.6" fill="#6b7280">THE CYCLE FROM ADOPTION THROUGH OPERATION TO REVIEW</text>

    <rect x="260" y="42" width="240" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="380" y="70" text-anchor="middle" font-size="13.5" fill="#111827">Adopt a model or dataset</text>
    <line x1="380" y1="86" x2="380" y2="102" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ga)"/>

    <rect x="240" y="110" width="280" height="52" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#g1)"/>
    <text x="260" y="134" font-size="13.5" fill="#111827">Development — build the AI SBOM</text>
    <text x="260" y="152" font-size="12" fill="#6b7280">Record licenses and provenance</text>
    <line x1="380" y1="162" x2="380" y2="182" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ga)"/>

    <rect x="240" y="190" width="280" height="52" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#g1)"/>
    <text x="260" y="214" font-size="13.5" fill="#111827">Review — duties, risk, compliance</text>
    <text x="260" y="232" font-size="12" fill="#6b7280">The governance owner approves</text>
    <line x1="380" y1="242" x2="380" y2="262" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ga)"/>

    <rect x="240" y="270" width="280" height="52" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#g1)"/>
    <text x="260" y="294" font-size="13.5" fill="#111827">Release — ship the AI SBOM with it</text>
    <text x="260" y="312" font-size="12" fill="#6b7280">Delivered together to the receiving system</text>
    <line x1="380" y1="322" x2="380" y2="342" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ga)"/>

    <rect x="240" y="350" width="280" height="52" rx="8" fill="#fdf1e9" stroke="#c2410c" stroke-width="1.8" filter="url(#g1)"/>
    <text x="260" y="374" font-size="13.5" fill="#111827">Operational monitoring</text>
    <text x="260" y="392" font-size="12" fill="#c2410c">Watch vulnerabilities and license changes</text>
    <line x1="380" y1="402" x2="380" y2="422" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ga)"/>

    <rect x="312" y="422" width="136" height="46" rx="23" fill="#fff" stroke="#c2410c" stroke-width="1.6" filter="url(#g1)"/>
    <text x="380" y="450" text-anchor="middle" font-size="13" fill="#111827">Changed?</text>

    <path d="M 448 445 L 660 445 L 660 136 L 524 136" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ga)"/>
    <text x="668" y="290" font-size="11.5" fill="#9ca3af">Model tree changed</text>
    <text x="668" y="308" font-size="11.5" fill="#9ca3af">— back to development</text>

    <path d="M 380 468 L 380 508" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ga)"/>
    <text x="392" y="492" font-size="11.5" fill="#9ca3af">Nothing — keep operating</text>

    <path d="M 312 445 L 130 445 L 130 250 L 236 250" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ga)"/>
    <text x="60" y="360" font-size="11.5" fill="#9ca3af">New rules</text>
    <text x="60" y="378" font-size="11.5" fill="#9ca3af">in force —</text>
    <text x="60" y="396" font-size="11.5" fill="#9ca3af">update and</text>
    <text x="60" y="414" font-size="11.5" fill="#9ca3af">re-review</text>

    <rect x="256" y="512" width="248" height="44" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#g1)"/>
    <text x="380" y="540" text-anchor="middle" font-size="13" fill="#111827">Periodic review — quarterly, annual</text>
  </g>
</svg>
