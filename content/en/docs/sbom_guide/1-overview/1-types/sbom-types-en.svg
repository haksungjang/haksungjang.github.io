<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470">
  <defs>
    <filter id="t1" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/></filter>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="820" height="470" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="40" y="28" font-size="12" letter-spacing="1.6" fill="#6b7280">EACH LIFECYCLE STAGE PRODUCES A DIFFERENT SBOM</text>

    <rect x="40" y="42" width="740" height="58" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#t1)"/>
    <text x="60" y="68" font-size="14" fill="#111827">Design SBOM &#183; design stage</text>
    <text x="60" y="88" font-size="12.5" fill="#6b7280">Records the planned components before anything is built</text>
    <line x1="410" y1="100" x2="410" y2="116" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ta)"/>

    <rect x="40" y="118" width="740" height="58" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#t1)"/>
    <text x="60" y="144" font-size="14" fill="#111827">Source SBOM &#183; development environment</text>
    <text x="60" y="164" font-size="12.5" fill="#6b7280">Source files and declared dependencies</text>
    <line x1="410" y1="176" x2="410" y2="192" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ta)"/>

    <rect x="40" y="194" width="740" height="58" rx="8" fill="#fdf1e9" stroke="#c2410c" stroke-width="1.8" filter="url(#t1)"/>
    <text x="60" y="220" font-size="14" fill="#111827">Build SBOM &#183; build process</text>
    <text x="60" y="240" font-size="12.5" fill="#c2410c">Source, dependencies and pre-built components — the most widely used</text>
    <line x1="410" y1="252" x2="410" y2="268" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ta)"/>

    <rect x="40" y="270" width="740" height="58" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#t1)"/>
    <text x="60" y="296" font-size="14" fill="#111827">Analyzed SBOM &#183; inspecting the built artifact</text>
    <text x="60" y="316" font-size="12.5" fill="#6b7280">Works back from the finished artifact — can be made without source</text>
    <line x1="410" y1="328" x2="410" y2="344" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ta)"/>

    <rect x="40" y="346" width="360" height="58" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#t1)"/>
    <text x="60" y="372" font-size="14" fill="#111827">Deployed SBOM</text>
    <text x="60" y="392" font-size="12.5" fill="#6b7280">Reflects install-time and configuration state</text>

    <rect x="420" y="346" width="360" height="58" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#t1)"/>
    <text x="440" y="372" font-size="14" fill="#111827">Runtime SBOM</text>
    <text x="440" y="392" font-size="12.5" fill="#6b7280">Includes dependencies loaded at run time</text>

    <line x1="40" y1="430" x2="780" y2="430" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="450" font-size="12.5" fill="#4b5563">Each step down holds more and is harder to produce. Which stage it came from decides what information it carries.</text>
  </g>
</svg>
