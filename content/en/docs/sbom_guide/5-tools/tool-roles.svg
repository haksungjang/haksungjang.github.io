<svg xmlns="http://www.w3.org/2000/svg" width="820" height="316" viewBox="0 0 820 316">
  <defs>
    <filter id="o1" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/></filter>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="820" height="316" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">
    <text x="40" y="28" font-size="12" letter-spacing="1.6" fill="#6b7280">세 부류의 도구가 역할을 나눕니다</text>

