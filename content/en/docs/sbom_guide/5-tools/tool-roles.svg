    <text x="551" y="200" text-anchor="middle" font-size="11.5" fill="#9ca3af">새 취약점을 다시 관리로</text>

    <line x1="40" y1="256" x2="780" y2="256" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="276" font-size="12.5" fill="#4b5563">관리와 대조는 한 번으로 끝나지 않고 오갑니다. 새 취약점이 나올 때마다 저장된 SBOM을 다시 대조합니다.</text>
    <text x="40" y="298" font-size="12" fill="#9ca3af">한 도구가 여러 역할을 겸하기도 합니다. 표에 든 이름은 대표 예시입니다.</text>
