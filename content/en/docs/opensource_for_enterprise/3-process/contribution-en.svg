<svg xmlns="http://www.w3.org/2000/svg" width="568" height="521" viewBox="0 0 568 521" font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#111827"/>
    </marker>
    <marker id="cs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 9 1 L 0 5 L 9 9 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="568" height="521" fill="#ffffff"/>

  <!-- lanes -->
  <rect x="12" y="14" width="146" height="486" fill="#eaeff5"/>
  <rect x="188" y="14" width="160" height="486" fill="#f7ecec"/>
  <rect x="382" y="14" width="174" height="486" fill="#e7f0e8"/>

  <text x="85" y="34" text-anchor="middle" font-size="13" fill="#7b3f8f" text-decoration="underline">OSPO</text>
  <text x="268" y="34" text-anchor="middle" font-size="13" fill="#7b3f8f" text-decoration="underline">Development team</text>
  <text x="469" y="34" text-anchor="middle" font-size="13" fill="#7b3f8f" text-decoration="underline">Open source project</text>

  <!-- step 1 -->
  <circle cx="192" cy="70" r="9" fill="#ffffff" stroke="#8b2f2f" stroke-width="1.2"/>
  <text x="192" y="75" text-anchor="middle" font-size="11" fill="#8b2f2f">1</text>
  <rect x="204" y="64" width="128" height="52" rx="4" fill="#b9dbb0" stroke="#7fae74" stroke-width="1.2"/>
  <text x="268" y="95" text-anchor="middle" font-size="13" fill="#1f2937">Internal approval</text>

  <!-- step 2 -->
  <circle cx="192" cy="160" r="9" fill="#ffffff" stroke="#8b2f2f" stroke-width="1.2"/>
  <text x="192" y="165" text-anchor="middle" font-size="11" fill="#8b2f2f">2</text>
  <rect x="204" y="154" width="128" height="52" rx="4" fill="#b9dbb0" stroke="#7fae74" stroke-width="1.2"/>
  <text x="268" y="185" text-anchor="middle" font-size="13" fill="#1f2937">Ask OSPO to review</text>

  <rect x="14" y="154" width="128" height="52" rx="4" fill="#a9bad6" stroke="#7f92b3" stroke-width="1.2"/>
  <text x="78" y="185" text-anchor="middle" font-size="13" fill="#1f2937">Review / Approval</text>
  <line x1="150" y1="180" x2="196" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#ce)" marker-start="url(#cs)"/>

  <!-- step 3 -->
  <circle cx="192" cy="250" r="9" fill="#ffffff" stroke="#8b2f2f" stroke-width="1.2"/>
  <text x="192" y="255" text-anchor="middle" font-size="11" fill="#8b2f2f">3</text>
  <rect x="204" y="244" width="128" height="52" rx="4" fill="#b9dbb0" stroke="#7fae74" stroke-width="1.2"/>
  <text x="268" y="268" text-anchor="middle" font-size="13" fill="#1f2937">Read the project's</text>
  <text x="268" y="286" text-anchor="middle" font-size="13" fill="#1f2937">contribution docs</text>

  <rect x="404" y="238" width="132" height="64" rx="4" fill="#f2e9a0" stroke="#c9bd5e" stroke-width="1.2"/>
  <text x="470" y="262" text-anchor="middle" font-size="12" fill="#1f2937">Contribution guide</text>
  <text x="470" y="284" text-anchor="middle" font-size="12" fill="#1f2937">README, CONTRIBUTING</text>
  <line x1="332" y1="270" x2="404" y2="270" stroke="#111827" stroke-width="1.3"/>

  <!-- step 4 -->
  <circle cx="192" cy="340" r="9" fill="#ffffff" stroke="#8b2f2f" stroke-width="1.2"/>
  <text x="192" y="345" text-anchor="middle" font-size="11" fill="#8b2f2f">4</text>
  <rect x="204" y="334" width="128" height="52" rx="4" fill="#b9dbb0" stroke="#7fae74" stroke-width="1.2"/>
  <text x="268" y="358" text-anchor="middle" font-size="13" fill="#1f2937">Check the company's</text>
  <text x="268" y="376" text-anchor="middle" font-size="13" fill="#1f2937">contribution rules</text>

  <!-- step 5 -->
  <circle cx="192" cy="430" r="9" fill="#ffffff" stroke="#8b2f2f" stroke-width="1.2"/>
  <text x="192" y="435" text-anchor="middle" font-size="11" fill="#8b2f2f">5</text>
  <rect x="204" y="424" width="128" height="52" rx="4" fill="#b9dbb0" stroke="#7fae74" stroke-width="1.2"/>
  <text x="268" y="448" text-anchor="middle" font-size="13" fill="#1f2937">Submit the</text>
  <text x="268" y="466" text-anchor="middle" font-size="13" fill="#1f2937">contribution</text>
  <line x1="332" y1="450" x2="440" y2="450" stroke="#111827" stroke-width="1.6" marker-end="url(#ce)"/>

  <!-- project mark -->
  <circle cx="470" cy="450" r="26" fill="#1f2328"/>
  <path d="M470 432c-10 0-18 8-18 18 0 8 5 14 12 17 1 0 1-.4 1-.9v-3.2c-5 1.1-6-2.4-6-2.4-.8-2.1-2-2.6-2-2.6-1.6-1.1.1-1.1.1-1.1 1.8.1 2.8 1.9 2.8 1.9 1.6 2.8 4.2 2 5.2 1.5.2-1.2.6-2 1.2-2.5-4.1-.5-8.4-2.1-8.4-9.1 0-2 .7-3.6 1.9-4.9-.2-.5-.8-2.4.2-4.9 0 0 1.5-.5 5 1.9 1.5-.4 3-.6 4.6-.6s3.1.2 4.6.6c3.5-2.4 5-1.9 5-1.9 1 2.5.4 4.4.2 4.9 1.2 1.3 1.9 2.9 1.9 4.9 0 7-4.3 8.6-8.4 9.1.7.6 1.3 1.7 1.3 3.4v5.1c0 .5 0 .9 1 .9 7-2.9 12-9.1 12-17 0-10-8-18-18-18z" fill="#ffffff"/>
</svg>
