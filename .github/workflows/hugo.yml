name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  pull_request: # Dependabot PR 테스트를 위해 추가됨

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # htmltest를 PATH에 설치한다(버전 고정). 이후 build:production이 끝나면
      # postbuild:production 훅(npm run check:links)이 자동으로 링크를 검사한다.
      - name: Install htmltest
        run: |
          curl -fsSL https://raw.githubusercontent.com/wjdp/htmltest/master/godownloader.sh | bash -s -- -b "$PWD/bin" v0.17.0
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Build with Hugo
        # peaceiris/actions-hugo로 전역 Hugo를 따로 설치하지 않는다. npm ci가
        # package.json에 고정된 hugo-extended 버전을 node_modules/.bin/hugo에
        # 설치하므로, 로컬(npm run build)과 CI가 항상 같은 버전으로 빌드된다.
        run: npm run build:production

      # 배포 단계 (Master 브랜치일 때만 실행)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      # 배포 후 IndexNow로 검색엔진(Bing·네이버 등)에 바뀐 페이지를 알린다.
      # 키는 static/<키>.txt 로 사이트에 공개되어 있어 스크립트가 그 파일에서 읽는다.
      # 대상은 sitemap의 lastmod가 최근 24시간 안인 URL이다(enableGitInfo로 커밋 시각 반영).
      # gh-pages 반영까지 시간이 걸리므로 잠시 기다린 뒤 알린다. 알림 실패는 배포를 실패시키지 않는다.
      - name: Ping IndexNow
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          sleep 90
          python3 .github/scripts/indexnow.py --hours 24
