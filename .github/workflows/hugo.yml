name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  pull_request: # Dependabot PR 테스트를 위해 추가됨

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build with Hugo
        # peaceiris/actions-hugo로 전역 Hugo를 따로 설치하지 않는다. npm ci가
        # package.json에 고정된 hugo-extended 버전을 node_modules/.bin/hugo에
        # 설치하므로, 로컬(npm run build)과 CI가 항상 같은 버전으로 빌드된다.
        run: npm run build:production

      # 배포 단계 (Master 브랜치일 때만 실행)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      # 배포 후 IndexNow로 검색엔진(Bing·네이버 등)에 변경 알림.
      # 키는 static/<키>.txt 로 사이트에 게시되어 있고,
      # 저장소 Settings → Secrets and variables → Actions → Variables 에 INDEXNOW_KEY 로 등록한다.
      - name: Ping IndexNow
        if: ${{ github.ref == 'refs/heads/master' && vars.INDEXNOW_KEY != '' }}
        run: |
          curl -s "https://api.indexnow.org/indexnow?url=https://haksungjang.github.io/&key=${{ vars.INDEXNOW_KEY }}"
