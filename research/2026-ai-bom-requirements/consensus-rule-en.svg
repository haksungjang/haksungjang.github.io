<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
  <defs>
    <filter id="u1" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="ua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="430" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">

    <text x="40" y="28" font-size="12" letter-spacing="1.6" fill="#6b7280">THE FIVE SOURCES COUNTED</text>

    <!-- G7 (always one vote) -->
    <rect x="40" y="44" width="212" height="76" rx="8" fill="#fdf1e9" stroke="#e8c4a8" filter="url(#u1)"/>
    <text x="58" y="70" font-size="14" fill="#111827">G7 SBOM for AI</text>
    <text x="58" y="92" font-size="12.5" fill="#c2410c">Recommends all 50</text>
    <text x="58" y="110" font-size="12.5" fill="#c2410c">One vote on every element</text>

    <!-- the other four -->
    <rect x="272" y="44" width="120" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#u1)"/>
    <text x="332" y="70" text-anchor="middle" font-size="13.5" fill="#111827">SPDX 3.0.1</text>
    <text x="332" y="92" text-anchor="middle" font-size="12" fill="#6b7280">Cardinality in</text>
    <text x="332" y="108" text-anchor="middle" font-size="12" fill="#6b7280">the spec</text>

    <rect x="402" y="44" width="120" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#u1)"/>
    <text x="462" y="70" text-anchor="middle" font-size="13.5" fill="#111827">CycloneDX 1.6</text>
    <text x="462" y="92" text-anchor="middle" font-size="12" fill="#6b7280">required array</text>
    <text x="462" y="108" text-anchor="middle" font-size="12" fill="#6b7280">in the schema</text>

    <rect x="532" y="44" width="110" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#u1)"/>
    <text x="587" y="70" text-anchor="middle" font-size="13.5" fill="#111827">NTIA</text>
    <text x="587" y="92" text-anchor="middle" font-size="12" fill="#6b7280">Seven baseline</text>
    <text x="587" y="108" text-anchor="middle" font-size="12" fill="#6b7280">data fields</text>

    <rect x="652" y="44" width="108" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#u1)"/>
    <text x="706" y="70" text-anchor="middle" font-size="13.5" fill="#111827">OpenChain</text>
    <text x="706" y="92" text-anchor="middle" font-size="12" fill="#6b7280">License</text>
    <text x="706" y="108" text-anchor="middle" font-size="12" fill="#6b7280">process rules</text>

    <!-- rule -->
    <line x1="400" y1="120" x2="400" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ua)"/>
    <rect x="120" y="158" width="560" height="76" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="400" y="186" text-anchor="middle" font-size="15" fill="#111827">Required when two or more sources demand its presence</text>
    <text x="400" y="212" text-anchor="middle" font-size="12.5" fill="#6b7280">G7 always casts one vote, so in practice it turns on whether any one of the other four requires it</text>

    <!-- two branches -->
    <path d="M 400 234 L 400 254 L 250 254 L 250 276" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ua)"/>
    <path d="M 400 234 L 400 254 L 550 254 L 550 276" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ua)"/>

    <rect x="110" y="284" width="280" height="86" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.8" filter="url(#u1)"/>
    <text x="250" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#c2410c">20 required</text>
    <text x="250" y="340" text-anchor="middle" font-size="12.5" fill="#6b7280">G7 plus at least one</text>
    <text x="250" y="358" text-anchor="middle" font-size="12.5" fill="#6b7280">other standard requires it</text>

    <rect x="410" y="284" width="280" height="86" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#u1)"/>
    <text x="550" y="314" text-anchor="middle" font-size="15" fill="#111827">30 optional</text>
    <text x="550" y="340" text-anchor="middle" font-size="12.5" fill="#6b7280">Only G7 counts it as minimum;</text>
    <text x="550" y="358" text-anchor="middle" font-size="12.5" fill="#6b7280">no other standard compels it</text>

    <!-- note -->
    <line x1="40" y1="396" x2="760" y2="396" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="416" font-size="12.5" fill="#4b5563">Conditional fields, required only when the object is created, are not counted. Regulation sits on a separate axis.</text>
  </g>
</svg>
