<svg xmlns="http://www.w3.org/2000/svg" width="820" height="452" viewBox="0 0 820 452">
  <defs>
    <filter id="c2" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#000" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="820" height="452" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">

    <text x="40" y="28" font-size="13.5" fill="#111827">Six inherited from ISO/IEC 5230</text>
    <text x="40" y="48" font-size="12" fill="#9ca3af">The skeleton of an open source compliance program, AI or not.</text>

    <text x="430" y="28" font-size="13.5" fill="#c2410c">Four extended for AI</text>
    <text x="430" y="48" font-size="12" fill="#9ca3af">New requirements that models and data bring in.</text>

    <!-- inherited six -->
    <rect x="40" y="64" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="90" font-size="13" fill="#374151">3.1  Policy — a written policy, communicated internally</text>

    <rect x="40" y="114" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="140" font-size="13" fill="#374151">3.2  Competence — role competencies, evidence kept</text>

    <rect x="40" y="164" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="190" font-size="13" fill="#374151">3.3  Awareness — awareness activities for staff</text>

    <rect x="40" y="214" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="240" font-size="13" fill="#374151">3.4  Program scope — defining what it applies to</text>

    <rect x="40" y="264" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="290" font-size="13" fill="#374151">3.7  Access — a channel for external inquiries</text>

    <rect x="40" y="314" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="340" font-size="13" fill="#374151">3.8  Resources — resources to run the program</text>

    <!-- AI extension four -->
    <rect x="430" y="64" width="350" height="66" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.6" filter="url(#c2)"/>
    <text x="450" y="88" font-size="13.5" fill="#111827">3.5  License Obligations</text>
    <text x="450" y="112" font-size="12" fill="#6b7280">Identifying and meeting model and dataset licenses</text>

    <rect x="430" y="138" width="350" height="66" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.6" filter="url(#c2)"/>
    <text x="450" y="162" font-size="13.5" fill="#111827">3.6  Transparency Obligations</text>
    <text x="450" y="186" font-size="12" fill="#6b7280">Disclosure required by regulation and contracts</text>

    <rect x="430" y="212" width="350" height="66" rx="6" fill="#fdf1e9" stroke="#c2410c" stroke-width="1.8" filter="url(#c2)"/>
    <text x="450" y="236" font-size="13.5" fill="#111827">3.9  AI SBOM</text>
    <text x="450" y="260" font-size="12" fill="#c2410c">The item the guide is named for. Its procedures</text>

    <rect x="430" y="286" width="350" height="66" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.6" filter="url(#c2)"/>
    <text x="450" y="310" font-size="13.5" fill="#111827">3.10  Governance</text>
    <text x="450" y="334" font-size="12" fill="#6b7280">Decision-making structure for the use of AI</text>

    <!-- note -->
    <line x1="40" y1="382" x2="780" y2="382" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="404" font-size="12.5" fill="#4b5563">All ten are process requirements. They set what to have in place but do not prescribe data fields, so what an AI SBOM</text>
    <text x="40" y="424" font-size="12.5" fill="#4b5563">carries is filled in by format standards such as SPDX 3.0 or CycloneDX 1.6.</text>
    <text x="40" y="446" font-size="12" fill="#9ca3af">Numbering follows sections 3.1-3.10 of the guide; the six on the left inherit the corresponding ISO/IEC 5230 clauses.</text>
  </g>
</svg>
