<svg xmlns="http://www.w3.org/2000/svg" width="820" height="452" viewBox="0 0 820 452">
  <defs>
    <filter id="c2" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#000" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="820" height="452" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">

    <text x="40" y="28" font-size="13.5" fill="#111827">ISO/IEC 5230에서 이어받은 여섯</text>
    <text x="40" y="48" font-size="12" fill="#9ca3af">오픈소스 컴플라이언스 프로그램의 뼈대. AI 여부와 무관하게 요구되는 항목입니다.</text>

    <text x="430" y="28" font-size="13.5" fill="#c2410c">AI로 확장한 넷</text>
    <text x="430" y="48" font-size="12" fill="#9ca3af">모델과 데이터가 들어오면서 새로 생긴 요구입니다.</text>

    <!-- 계승 6 -->
    <rect x="40" y="64" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="90" font-size="13" fill="#374151">3.1  정책 — 성문 정책의 존재와 내부 전달</text>

    <rect x="40" y="114" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="140" font-size="13" fill="#374151">3.2  역량 — 역할별 역량 식별과 증거 보존</text>

    <rect x="40" y="164" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="190" font-size="13" fill="#374151">3.3  인지 — 구성원 대상 인지 활동</text>

    <rect x="40" y="214" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="240" font-size="13" fill="#374151">3.4  프로그램 범위 — 적용 대상 정의</text>

    <rect x="40" y="264" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="290" font-size="13" fill="#374151">3.7  접근 — 외부 문의에 대응하는 창구</text>

    <rect x="40" y="314" width="350" height="42" rx="6" fill="#fff" stroke="#d1d5db" filter="url(#c2)"/>
    <text x="58" y="340" font-size="13" fill="#374151">3.8  자원 배분 — 프로그램 운영 자원 확보</text>

    <!-- AI 확장 4 -->
    <rect x="430" y="64" width="350" height="66" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.6" filter="url(#c2)"/>
    <text x="450" y="88" font-size="13.5" fill="#111827">3.5  라이선스 의무</text>
    <text x="450" y="112" font-size="12" fill="#6b7280">모델과 데이터셋 라이선스의 식별과 이행</text>

    <rect x="430" y="138" width="350" height="66" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.6" filter="url(#c2)"/>
    <text x="450" y="162" font-size="13.5" fill="#111827">3.6  투명성 의무</text>
    <text x="450" y="186" font-size="12" fill="#6b7280">규제와 계약이 요구하는 정보 공개 대응</text>

    <rect x="430" y="212" width="350" height="66" rx="6" fill="#fdf1e9" stroke="#c2410c" stroke-width="1.8" filter="url(#c2)"/>
    <text x="450" y="236" font-size="13.5" fill="#111827">3.9  AI SBOM</text>
    <text x="450" y="260" font-size="12" fill="#c2410c">가이드 이름이 걸린 항목. 작성과 관리 절차</text>

    <rect x="430" y="286" width="350" height="66" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.6" filter="url(#c2)"/>
    <text x="450" y="310" font-size="13.5" fill="#111827">3.10  거버넌스</text>
    <text x="450" y="334" font-size="12" fill="#6b7280">AI 사용에 관한 의사결정 체계</text>

    <!-- 주석 -->
    <line x1="40" y1="382" x2="780" y2="382" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="404" font-size="12.5" fill="#4b5563">열 개 모두 프로세스 요구입니다. 무엇을 갖출지는 정하되 데이터 필드는 규정하지 않으므로, AI SBOM에 어떤 항목을</text>
    <text x="40" y="424" font-size="12.5" fill="#4b5563">담을지는 SPDX 3.0이나 CycloneDX 1.6 같은 형식 표준이 채웁니다.</text>
    <text x="40" y="446" font-size="12" fill="#9ca3af">번호는 가이드 본문 3.1~3.10을 따르며, 왼쪽 여섯은 ISO/IEC 5230의 대응 조항을 계승합니다.</text>
  </g>
</svg>
