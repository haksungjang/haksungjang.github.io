<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410">
  <defs>
    <filter id="s1" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="820" height="410" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">

    <!-- 비전 -->
    <rect x="240" y="24" width="340" height="56" rx="8" fill="#fdf1e9" stroke="#c2410c" stroke-width="1.6" filter="url(#s1)"/>
    <text x="410" y="48" text-anchor="middle" font-size="12" letter-spacing="1.4" fill="#c2410c">비전</text>
    <text x="410" y="70" text-anchor="middle" font-size="15" fill="#111827">SW 공급망 사이버 복원력 확보</text>

    <!-- 분기선 -->
    <path d="M 410 80 L 410 100 L 150 100 L 150 122" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#sa)"/>
    <path d="M 410 100 L 410 122" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#sa)"/>
    <path d="M 410 100 L 670 100 L 670 122" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#sa)"/>

    <!-- 예방 -->
    <rect x="24" y="130" width="252" height="228" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#s1)"/>
    <text x="44" y="156" font-size="15" fill="#111827">예방</text>
    <text x="44" y="176" font-size="12" fill="#9ca3af">위협 예방 역량 강화</text>
    <line x1="44" y1="188" x2="256" y2="188" stroke="#f3f4f6" stroke-width="1"/>
    <text x="44" y="210" font-size="12.5" fill="#4b5563">안전한 SW 개발 방법론</text>
    <text x="44" y="228" font-size="11.5" fill="#9ca3af">NIST SSDF 참고, 단계별 보안 활동</text>
    <text x="44" y="254" font-size="12.5" fill="#4b5563">공급망 보안 가이드라인 2.0</text>
    <text x="44" y="272" font-size="11.5" fill="#9ca3af">라이선스 중심에서 보안으로 확장</text>
    <text x="44" y="298" font-size="12.5" fill="#4b5563">SBOM 관리모델</text>
    <text x="44" y="316" font-size="11.5" fill="#9ca3af">수출기업·파급력 높은 분야 우선</text>
    <text x="44" y="340" font-size="11.5" fill="#9ca3af">남은 과제 — 신뢰도 검증, 안전한 유통</text>

    <!-- 복원 -->
    <rect x="284" y="130" width="252" height="228" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#s1)"/>
    <text x="304" y="156" font-size="15" fill="#111827">복원</text>
    <text x="304" y="176" font-size="12" fill="#9ca3af">신속한 탐지·대응 체계</text>
    <line x1="304" y1="188" x2="516" y2="188" stroke="#f3f4f6" stroke-width="1"/>
    <text x="304" y="210" font-size="12.5" fill="#4b5563">버그바운티·CVD·VDP 확대</text>
    <text x="304" y="228" font-size="11.5" fill="#9ca3af">정보통신망법 개정 추진</text>
    <text x="304" y="254" font-size="12.5" fill="#4b5563">공공 SBOM 통합관리</text>
    <text x="304" y="272" font-size="11.5" fill="#9ca3af">VEX 포함, 취약점 정보 DB</text>
    <text x="304" y="298" font-size="12.5" fill="#4b5563">C-Clean 대응 단축</text>
    <text x="304" y="316" font-size="11.5" fill="#9ca3af">평균 4개월 이상에서 3일 내로</text>
    <text x="304" y="340" font-size="11.5" fill="#9ca3af">중소기업 컨설팅 2026, 도구 보급 2027</text>

    <!-- 기반 -->
    <rect x="544" y="130" width="252" height="228" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#s1)"/>
    <text x="564" y="156" font-size="15" fill="#111827">기반</text>
    <text x="564" y="176" font-size="12" fill="#9ca3af">정책·제도적 기반 조성</text>
    <line x1="564" y1="188" x2="776" y2="188" stroke="#f3f4f6" stroke-width="1"/>
    <text x="564" y="210" font-size="12.5" fill="#4b5563">범정부 협의체</text>
    <text x="564" y="228" font-size="11.5" fill="#9ca3af">과기정통부·국정원 공동, 5개 분과</text>
    <text x="564" y="254" font-size="12.5" fill="#4b5563">시범인증과 상호인정</text>
    <text x="564" y="272" font-size="11.5" fill="#9ca3af">기존 ISMS·CSAP에 얹는 방식</text>
    <text x="564" y="298" font-size="12.5" fill="#4b5563">공공조달 SBOM 제출</text>
    <text x="564" y="316" font-size="11.5" fill="#9ca3af">보안적합성 검증과 결합</text>
    <text x="564" y="340" font-size="11.5" fill="#9ca3af">글로벌 협력 — GCLI, CISA, DG CONNECT</text>

    <!-- 주석 -->
    <line x1="24" y1="380" x2="796" y2="380" stroke="#e5e7eb" stroke-width="1"/>
    <text x="24" y="400" font-size="12.5" fill="#4b5563">AI 등 신기술 대응 공급망 보안 모델은 2027년 이후 별도 연구 과제로 분리했습니다. 이번 로드맵의 직접 범위 밖입니다.</text>
  </g>
</svg>
